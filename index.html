<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação das Apresentações</title>
    <style>
        body { font-family: Arial, sans-serif; background: #fffffe; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #e7f5ff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #0e218a; font-size: 1.6rem; margin-bottom: 25px; }
        

        .card-trabalho { background: #eef4fa; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .card-trabalho h3 { font-weight: 500; margin: 0 0 5px 0; color: #0c0d0f; font-size: 1.1rem; }
        .apresentador { font-weight: bold; color: #0e218a; font-size: 0.9rem; margin-bottom: 8px; }

        .card-detalhes { text-align: left; margin: 10px 0; }
        .card-detalhes summary { cursor: pointer; color: #0066cc; font-weight: bold; }
        .card-detalhes div { background: #e7f5ff; padding: 10px; border-radius: 6px; margin-top: 6px; }
        .card-detalhes p { margin: 4px 0; }
        
        .label-nota { font-size: 0.85rem; font-weight: bold; display: block; margin-bottom: 8px; }
        .escala-notas { display: flex; gap: 4px; flex-wrap: wrap; }
        .btn-nota { flex: 1 1 40px; height: 40px; border: 1px solid #cbd5e0; background: white; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-nota:hover { background: #edf2f7; }
        .btn-nota.selecionado { background: #0e218a; color: white; border-color: #2c1f0b; transform: scale(1.05); }

    
        .secao-final { margin-top: 30px; border-top: 2px solid #e2e8f0; padding-top: 20px; }
        .campo-email label { font-weight: bold; display: block; margin-bottom: 8px; color: #2d3748; }
        .campo-email input { width: 100%; padding: 12px; border: 2px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 1rem; margin-bottom: 15px; }
        
        .btn-enviar { width: 100%; background: #0e218a; color: white; border: none; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-enviar:hover { background: #0e218a; }
        
        #mensagem { margin-top: 15px; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; display: none; }
        .sucesso { background: #c6f6d5; color: #151f1a; }
    </style>
</head>
<body>

<div class="container">
    <h1>Avaliação das Apresentações</h1>

  
    <div id="containerApresentacoes"></div>

    <div class="secao-final">
        <div class="campo-email">
            <label for="email">Informe seu e-mail para concluir e registrar os votos:</label>
            <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <button class="btn-enviar" onclick="enviarVotacao()">Concluir e Enviar Votação</button>
        <div id="mensagem"></div>
    </div>
</div>

<script src="dados.js"></script>
<script>


    let notasSelecionadas = {};

    window.onload = function() {
        renderizarApresentacoes(trabalhos);
    };

    function renderizarApresentacoes(lista) {
        const container = document.getElementById('containerApresentacoes');
        container.innerHTML = '';

        lista.forEach(trab => {
            const card = document.createElement('div');
            card.className = 'card-trabalho';

            let botoesHTML = '';
            for (let i = 5; i <= 50; i+=5) {
                botoesHTML += `<button type="button" class="btn-nota" onclick="selecionarNota(${trab.id}, ${i}, this)">${i}</button>`;
            }

            card.innerHTML = `
                <h3>${trab.titulo}</h3>
                <div class="apresentador">Apresentado por: ${trab.apresentador}</div>
                <details class="card-detalhes">
                    <summary>📄 Ver detalhes do trabalho</summary>
                    <div>
                        <p><strong>Autores:</strong> ${trab.autores}</p>
                        <p><strong>Resumo:</strong> ${trab.resumo}</p>
                    </div>
                </details>
                <span class="label-nota">Atribua sua nota (5 a 50):</span>
                <div class="escala-notas" id="escala-${trab.id}">
                    ${botoesHTML}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function selecionarNota(trabalhoId, nota, elemento) {
        notasSelecionadas[trabalhoId] = nota;

        const containerPai = document.getElementById(`escala-${trabalhoId}`);
        const botoes = containerPai.querySelectorAll('.btn-nota');
        botoes.forEach(btn => btn.classList.remove('selecionado'));

        elemento.classList.add('selecionado');
    }

    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxdIndHXGT4pswL6BP-vH61FUjU7OzG77fJfg2tx3oHspd6gsKix4jRkzpsHmAo_xJS/exec";

    function enviarVotacao() {
        const email = document.getElementById('email').value.trim();

        if (!email) {
            alert("Digite seu e-mail.");
            return;
        }

        fetch(URL_APPS_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: email,
                votos: notasSelecionadas
            })
        })
        .then(() => alert("Voto registrado com sucesso!"))
        .catch(() => alert("Erro ao enviar. Verifique sua conexão."));
    }
</script>

</body>
</html>
